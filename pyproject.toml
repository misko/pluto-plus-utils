[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pluto-plus-utils"
version = "0.1.0"
description = "Standalone Pluto+ radio control, capture, analysis, and web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=1.26",
  "pexpect>=4.9",
  "pydantic>=2.9",
  "typer>=0.12",
  "uvicorn>=0.30",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "types-pexpect>=4.9",
]
hardware = [
  "pyadi-iio>=0.0.21",
  "pylibiio>=0.25,<0.27",
  "libusb1>=3.1",
  "setuptools>=75,<82",
]
browser = [
  "playwright>=1.49,<2",
]

[project.scripts]
pluto = "pluto_plus.cli:app"
plutod = "pluto_plus.cli:serve_entrypoint"
pluto-install-metadata-runtime = "pluto_plus.metadata_runtime_install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pluto_plus"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/install_native_libiio.sh" = "pluto_plus/_native/install_native_libiio.sh"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "browser: requires the explicitly enabled Playwright browser lane",
  "hardware: requires an attached Pluto+ radio",
  "firmware: may reboot or alter explicitly selected radio firmware",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pluto_plus"]

[[tool.mypy.overrides]]
module = ["adi", "iio"]
ignore_missing_imports = true
